<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>PDF 助手</title>
<style>
  :root { --blue:#2563eb; --gray:#6b7280; --line:#e5e7eb; --bg:#f8fafc; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font: 16px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:#111827; }
  header { background:var(--blue); color:#fff; padding:16px; }
  header h1 { margin:0; font-size:18px; font-weight:600; }
  header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  main { padding:16px; max-width:640px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h2 { margin:0 0 10px; font-size:15px; font-weight:600; }
  .hint { font-size:13px; color:var(--gray); margin:6px 0 0; }
  .row { display:flex; flex-wrap:wrap; gap:10px; }
  button, .filebtn { font:16px/1 inherit; padding:14px 16px; border-radius:10px; border:1px solid var(--line); background:#fff; color:#111827; min-height:48px; }
  button.primary { background:var(--blue); color:#fff; border-color:var(--blue); width:100%; font-weight:600; }
  button.secondary { color:var(--gray); font-weight:400; }
  button.preset { flex:1 1 30%; font-weight:700; padding:18px 10px; font-size:17px; border:2px solid var(--blue); color:var(--blue); }
  button:disabled { opacity:.5; }
  input[type=password], input[type=text], textarea {
    width:100%; font:16px/1.4 inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:#111827;
  }
  textarea { min-height:88px; resize:vertical; }
  .filebtn { display:block; text-align:center; font-weight:600; flex:1 1 45%; }
  input[type=file] { display:none; }
  .files { margin:10px 0 0; font-size:14px; color:#111827; }
  .files li { margin:2px 0; }
  .status { margin-top:12px; font-size:14px; white-space:pre-wrap; }
  .ok { color:#047857; } .err { color:#b91c1c; } .warn { color:#b45309; }
  a.dl { display:block; padding:14px 16px; margin:8px 0 0; border:1px solid var(--blue); border-radius:10px; color:var(--blue); text-decoration:none; font-weight:600; word-break:break-all; }
  footer { text-align:center; color:var(--gray); font-size:12px; padding:8px 16px 28px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>PDF 助手</h1>
  <p>选文件 → 点一个按钮 → 处理好的文件回这里（也会发到飞书）</p>
</header>
<main>
  <section class="card" id="authCard">
    <h2>先填一次访问口令</h2>
    <input type="password" id="tokenInput" placeholder="访问口令（至少 16 位）" autocomplete="off">
    <p class="hint">口令只存在这台手机上（浏览器本地），用来让你的电脑认得出是你。</p>
    <div class="row" style="margin-top:10px"><button class="primary" id="saveToken">保存并连接</button></div>
    <div class="status" id="authStatus"></div>
  </section>

  <section class="card hidden" id="workCard">
    <h2>1. 选文件</h2>
    <div class="row">
      <label class="filebtn" for="anyInput">📁 任意文件</label>
      <label class="filebtn" for="fileInput">📄 PDF</label>
      <label class="filebtn" for="imageInput">🖼 图片</label>
    </div>
    <!-- 三个入口，都不带 accept 的"任意文件"是兜底：安卓上各种选择器差异极大，
         不带 accept 更能出现"文件/浏览"；**都不加 multiple**（安卓多选常返回空列表 ✗）。 -->
    <input type="file" id="anyInput">
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
    <input type="file" id="imageInput" accept="image/*">
    <ul class="files" id="fileList"></ul>
    <div class="status" id="fileHintExtra"></div>
    <p class="hint" id="fileHint">只看到"相册"没有"文件"？<br>
      · 在选择器**右上角/更多**里选「文件 / 文档 / 浏览」；<br>
      · 或把文件先「保存到手机 → 文件」，再从这里选；<br>
      · 微信内置浏览器限制最多，建议用**系统浏览器（Chrome）**打开本页。</p>
  </section>

  <section class="card hidden" id="actionCard">
    <h2>2. 点一个按钮开始处理</h2>
    <div class="row" id="presetRow"></div>
    <p class="hint" id="presetHint"></p>

    <details style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--gray);font-size:14px">我要自己写要求（可选）</summary>
      <textarea id="customText" placeholder="例如：给这份文件的第 1 页居中加页码"></textarea>
      <button id="sendCustom" style="width:100%;margin-top:8px">按我写的要求处理</button>
    </details>

    <!-- 反馈紧跟按钮：点完立刻能看到"正在上传 / 已提交 / 进度"（之前放在下面的卡片里，很容易以为没反应 ✗） -->
    <div class="status" id="statusText"></div>
    <div class="row" style="margin-top:8px">
      <button id="refreshStatus" class="hidden" style="flex:1">🔄 刷新状态</button>
      <button id="newTask" class="hidden" style="flex:1">➕ 再处理一个</button>
    </div>
    <div id="artifactList"></div>
  </section>

</main>
<footer>本机服务 · 只在内网/Tailscale 内可达</footer>
<script>
(function () {
  var PRESETS = __PRESETS__;
  var tokenKey = 'pdf-helper-token';
  var token = '';
  var files = [];
  var currentTask = '';
  var pollTimer = null;

  var VERSION = 'v3-debug';
  function $(id) { return document.getElementById(id); }
  function dbg(line) {
    try { var el = $('debug'); if (el) { el.textContent = (el.textContent + '\n' + line).split('\n').slice(-12).join('\n'); } } catch (e) {}
  }
  window.onerror = function (msg, src, line, col) { dbg('❌ JS 错误: ' + msg + ' @' + line + ':' + col); };
  dbg('页面 ' + VERSION + ' 已加载 ' + new Date().toLocaleTimeString());
  // 元素不存在时**不能抛异常**：实测删掉一个卡片后，残留的
  // 把后面的"渲染预设按钮"整段跳过，页面就变成"有卡片、没按钮" ✗。
  function show(el, yes) { if (!el) { return; } el.className = el.className.replace(/ ?hidden/, '') + (yes ? '' : ' hidden'); }
  function setStatus(id, text, cls) { var el = $(id); if (!el) { dbg('⚠️ 找不到状态位 #' + id); return; } el.textContent = text; el.className = 'status ' + (cls || ''); }

  function api(path, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers['Authorization'] = 'Bearer ' + token;
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) { return { status: res.status, body: body }; });
    });
  }

  /** 渲染预设按钮。页面注入的 PRESETS 就能渲染，所以**加载时立刻显示**，不必等网络 ✓ */
  function renderPresets(names) {
    try {
      var row = $('presetRow');
      if (!row) { dbg('⚠️ 找不到 #presetRow'); return; }
      var list = toArray(names || []);
      row.innerHTML = '';
      var hint = $('presetHint');
      if (list.length === 0) {
        if (hint) { hint.textContent = '（这台电脑还没配预设，用下面的输入框说要求即可）'; }
        return;
      }
      if (hint) { hint.textContent = '按钮就是预设任务，点一下就用它处理你选的文件。'; }
      list.forEach(function (name) {
        var b = document.createElement('button');
        b.className = 'preset'; b.type = 'button'; b.textContent = name;
        b.onclick = function () { submit(name); };
        row.appendChild(b);
      });
      dbg('已渲染预设按钮: ' + list.join(' / '));
    } catch (e) { dbg('❌ 渲染预设按钮失败: ' + e); }
  }

  function connect() {
    setStatus('authStatus', '正在连接…');
    api('/api/health').then(function (r) {
      if (r.status !== 200) { setStatus('authStatus', '口令不对，或者服务没开。再试一次。', 'err'); return; }
      try { localStorage.setItem(tokenKey, token); } catch (e) {}
      show($('authCard'), false); show($('workCard'), true); show($('actionCard'), true);
      // 服务器返回的预设为准（配置改了不用刷新页面）；拿不到就用页面注入的那份
      renderPresets((r.body && r.body.presets) || PRESETS);
    }).catch(function () { setStatus('authStatus', '连不上：检查手机和电脑是否在同一个 Tailscale 网络里。', 'err'); });
  }

  $('saveToken').onclick = function () { token = $('tokenInput').value.trim(); if (token.length < 16) { setStatus('authStatus', '口令至少 16 位。', 'err'); return; } connect(); };

  /** 把 FileList / 类数组**转成真数组**：安卓 Chrome 的 FileList 没有 forEach（实测报错 ✗）。 */
  function toArray(list) {
    var out = [];
    if (!list) { return out; }
    for (var i = 0; i < list.length; i += 1) { out.push(list[i]); }
    return out;
  }

  function addFiles(list) {
    toArray(list).forEach(function (f) {
      // 同一个文件别重复加（重复选同一个不会报错，但会让上传变大）
      var dup = files.some(function (g) { return g.name === f.name && g.size === f.size; });
      if (!dup) { files.push(f); }
    });
    var box = $('fileList'); box.innerHTML = '';
    if (files.length === 0) { box.innerHTML = '<li>还没选文件</li>'; return; }
    files.forEach(function (f, index) {
      var li = document.createElement('li');
      li.textContent = (index + 1) + '. ' + f.name + '（' + Math.max(1, Math.round(f.size / 1024)) + ' KB）';
      box.appendChild(li);
    });
    var clear = document.createElement('button');
    clear.type = 'button'; clear.textContent = '清空已选';
    clear.onclick = function () { files = []; addFiles([]); };
    box.appendChild(clear);
  }

  function pick(ids) {
    ids.forEach(function (id) {
      var el = $(id);
      if (!el) { return; }
      el.onchange = function (event) {
        // 三个坑都在这里：
        // ① 不要立刻 `value = ''`（安卓上会把 FileList 清空，取到空列表 ✗）；
        // ② 选择器刚返回时不一定已经填好，**延迟一拍**再读更稳；
        // ③ 空选择要**明确告诉用户**，不能静默显示"还没选文件"（会以为操作失败 ✗）。
        dbg('输入框 ' + id + ' 触发了 change');
        setTimeout(function () {
          var list = event.target.files;
          dbg('  → 收到 ' + ((list && list.length) || 0) + ' 个文件' + (list && list[0] ? '：' + list[0].name : ''));
          if (!list || list.length === 0) {
            setStatus('fileHintExtra', '⚠️ 这次选择没有返回文件：换一个入口试试（📁 任意文件），'
              + '或先在文件 App 里把文件"保存到手机/文件"，再回来选。微信内置浏览器限制最多，建议用 Chrome。', 'err');
            return;
          }
          setStatus('fileHintExtra', '');
          addFiles(list);
        }, 0);
      };
    });
  }
  try { pick(['anyInput', 'fileInput', 'imageInput']); dbg('已绑定选择入口 anyInput/fileInput/imageInput'); } catch (e) { dbg('❌ 绑定失败: ' + e); }
  addFiles([]);
  renderPresets(PRESETS);   // 立刻显示按钮：即使还没填口令、或网络慢，也看得到

  function readBase64(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () { var s = String(reader.result); resolve(s.slice(s.indexOf(',') + 1)); };
      reader.onerror = function () { resolve(''); };
      reader.readAsDataURL(file);
    });
  }

  function setBusy(busy) {
    var buttons = document.querySelectorAll('#presetRow button, #sendCustom');
    for (var i = 0; i < buttons.length; i += 1) { buttons[i].disabled = !!busy; }
    show($('refreshStatus'), !busy);
    show($('newTask'), !busy);
  }

  function submit(instruction) {
    if (!instruction) { return; }
    // ① 立刻给反馈：先把"正在上传"写在按钮下面，并禁用按钮防重复点
    setBusy(true);
    setStatus('statusText', '⏳ 正在上传文件（' + files.length + ' 个）…', 'warn');
    $('statusText').scrollIntoView({ block: 'nearest' });
    $('artifactList').innerHTML = '';
    var jobs = files.map(function (f) { return readBase64(f).then(function (b64) { return { name: f.name, contentBase64: b64 }; }); });
    Promise.all(jobs).then(function (payload) {
      return api('/api/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction: instruction, files: payload }) });
    }).then(function (r) {
      if (r.status !== 202) {
        setBusy(false);
        setStatus('statusText', r.status === 401 ? '口令不对。' : ('提交失败：' + JSON.stringify(r.body)), 'err');
        return;
      }
      currentTask = r.body.taskId;
      try { localStorage.setItem('pdf-helper-task', currentTask); } catch (e) {}
      setStatus('statusText', '✅ 已提交：' + instruction + '\n任务号 ' + currentTask + '\n正在处理，通常 1~3 分钟；这一步不用管它，我每 2 秒自动刷新。', 'warn');
      startPolling();
    }).catch(function (e) { setBusy(false); setStatus('statusText', '提交出错：' + e, 'err'); });
  }

  // 轮询：**用 setTimeout 自排程**而不是 setInterval —— 手机切到别的 App 时定时器会被系统掐断，
  // 所以还要在页面重新可见/获得焦点时立刻补一次（实测"不刷新就永远停在排队中"就是这个 ✗）。
  var pollTimer = null;
  function schedulePoll(ms) {
    if (pollTimer) { clearTimeout(pollTimer); }
    pollTimer = setTimeout(poll, ms);
  }
  function startPolling() { schedulePoll(300); }

  function poll() {
    if (!currentTask) { return; }
    var started = Date.now();
    api('/api/task/' + encodeURIComponent(currentTask)).then(function (r) {
      if (r.status !== 200) { schedulePoll(3000); return; }
      var s = r.body.status;
      var label = { queued: '⏳ 排队中（前面还有任务）', ok: '✅ 处理完成', timeout: '⏱️ 超时了', error: '❌ 处理失败', running: '⚙️ 处理中' }[s] || s;
      var stamp = new Date().toLocaleTimeString();
      setStatus('statusText', label + '\n任务号 ' + currentTask + (s === 'ok' ? '' : '\n（' + stamp + ' 更新，通常 1~3 分钟）'), s === 'ok' ? 'ok' : (s === 'error' || s === 'timeout' ? 'err' : 'warn'));
      if (s === 'ok' || s === 'error' || s === 'timeout') {
        if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
        setBusy(false);
        try { localStorage.removeItem('pdf-helper-task'); } catch (e) {}
        var list = toArray(r.body.artifacts || []);
        var box = $('artifactList'); box.innerHTML = '';
        if (list.length === 0) {
          box.innerHTML = '<p class="hint">这次没有可下载的产物。</p>';
        } else {
          var head = document.createElement('p');
          head.className = 'hint';
          head.textContent = '产物 ' + list.length + ' 个（点一下下载，然后就能在微信里转发）：';
          box.appendChild(head);
          list.forEach(function (path, index) {
            var a = document.createElement('a');
            a.className = 'dl';
            a.href = '/api/artifact?token=' + encodeURIComponent(token) + '&taskId=' + encodeURIComponent(currentTask) + '&index=' + index;
            a.textContent = '⬇︎ ' + path.split('/').pop();
            box.appendChild(a);
          });
          box.insertAdjacentHTML('beforeend', '<p class="hint">飞书群里也会收到同样一份（不想要可以忽略）。</p>');
        }
      } else {
        // 前 30 秒 2 秒一查（快反馈），之后放慢到 5 秒（省电）
        schedulePoll(Date.now() - started > 30000 ? 5000 : 2000);
      }
    }).catch(function () { schedulePoll(5000); });
  }

  $('refreshStatus').onclick = function () { poll(); };
  $('newTask').onclick = function () {
    currentTask = ''; files = []; addFiles([]);
    setStatus('statusText', ''); $('artifactList').innerHTML = '';
    $('customText').value = '';
    try { localStorage.removeItem('pdf-helper-task'); } catch (e) {}
  };
  // 切回页面 / 重新获得焦点时立刻补一次（手机后台定时器不可靠）
  document.addEventListener('visibilitychange', function () { if (!document.hidden && currentTask) { poll(); } });
  window.addEventListener('focus', function () { if (currentTask) { poll(); } });

  // 已经存过口令就直接进主界面
  try {
    var saved = localStorage.getItem(tokenKey);
    if (saved && saved.length >= 16) { token = saved; $('tokenInput').value = saved; connect(); }
    // 刷新/切回后还能接着看上一个任务（不再"必须刷新才知道完成了"）
    var lastTask = localStorage.getItem('pdf-helper-task');
    if (lastTask) { currentTask = lastTask; setBusy(true); setStatus('statusText', '正在查询上一个任务 ' + lastTask + ' …', 'warn'); startPolling(); }
  } catch (e) {}

  // ── 确认弹窗（防误触）+ 产物名称输入框 ──────────────────────────────
  // 做法：**包装** submit，而不是改各个按钮的 onclick——按钮/自定义入口都走 submit，
  // 这样只有一处需要维护，也不会因为页面结构变动而漏改（我在这上面踩过锚点失效的坑 ✗）。
  var presetFields = {};
  var __origSubmit = submit;

  function fileNameBase() {
    if (files.length === 0) { return '产物'; }
    var name = String(files[0].name).replace(/\.[^.]+$/, '');
    var cleaned = name.replace(/[（(]答案[)）]\s*$/u, '').replace(/\+?\s*答案\s*$/u, '').trim();
    return cleaned !== '' ? cleaned : name;
  }

  function openConfirmFor(instruction) {
    var isPreset = Object.prototype.hasOwnProperty.call(presetFields, instruction);
    var fields = isPreset ? toArray(presetFields[instruction]) : [];
    try {
      $('modalTitle').textContent = isPreset ? ('确认：' + instruction) : '确认提交';
      $('modalDesc').textContent = isPreset
        ? '名称可以改；留空就按默认命名。确认后立刻开始处理。'
        : '确认后立刻开始处理。';
      var box = $('modalFields');
      box.innerHTML = '';
      if (fields.length === 0) {
        var p1 = document.createElement('p');
        p1.className = 'hint';
        p1.textContent = String(instruction).slice(0, 160);
        box.appendChild(p1);
      }
      fields.forEach(function (f) {
        var label = document.createElement('label');
        label.className = 'hint';
        label.textContent = f.label;
        var input = document.createElement('input');
        input.type = 'text';
        input.id = 'field_' + f.key;
        input.value = fileNameBase() + (f.suffix || '');
        box.appendChild(label);
        box.appendChild(input);
      });
      $('modalOk').onclick = function () {
        var text = instruction;
        if (isPreset && fields.length > 0) {
          var lines = [];
          fields.forEach(function (f) {
            var el = $('field_' + f.key);
            var value = el ? String(el.value).trim() : '';
            if (value !== '') { lines.push(f.label + '：' + value); }
          });
          text = instruction;
          if (lines.length > 0) { text += '\n\n【本次命名要求（以此为准）】\n' + lines.join('\n'); }
        }
        show($('modal'), false);
        __origSubmit(text);
      };
      $('modalCancel').onclick = function () { show($('modal'), false); };
      show($('modal'), true);
      dbg('弹窗已打开：' + (isPreset ? instruction : '自定义') + '（输入框 ' + fields.length + ' 个）');
    } catch (e) {
      dbg('❌ 弹窗失败，直接提交：' + e);   // 兜底：弹窗出错也不能挡住用户
      __origSubmit(instruction);
    }
  }

  // 拦截：任何提交都先过确认弹窗；预设名去拿字段定义（拿不到就问服务器要）
  submit = function (instruction) {
    var needFields = Object.keys(presetFields).length === 0;
    if (!needFields) { openConfirmFor(instruction); return; }
    api('/api/health').then(function (r) {
      presetFields = (r.body && r.body.presetFields) || presetFields;
      openConfirmFor(instruction);
    }).catch(function () { openConfirmFor(instruction); });
  };
})();
</script>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:100;display:flex;align-items:flex-end">
  <div style="background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:14px 14px 0 0;padding:16px;max-height:88vh;overflow:auto">
    <h2 id="modalTitle" style="margin:0 0 4px;font-size:16px"></h2>
    <p class="hint" id="modalDesc"></p>
    <div id="modalFields"></div>
    <div class="row" style="margin-top:14px">
      <button id="modalCancel" style="flex:1">取消</button>
      <button id="modalOk" class="primary" style="flex:2">确认提交</button>
    </div>
  </div>
</div>
<div id="debug" style="position:fixed;left:0;right:0;bottom:0;background:#111827;color:#f9fafb;font:12px/1.45 ui-monospace,Menlo,monospace;padding:8px 10px;max-height:40vh;overflow:auto;white-space:pre-wrap;z-index:99"></div>
</body>
</html>
