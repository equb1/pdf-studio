<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<title>PDF 助手</title>
<style>
  :root {
    --blue:#2563eb; --blue-dark:#1d4ed8; --ink:#0f172a; --sub:#64748b;
    --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; --ok:#047857; --err:#b91c1c; --warn:#b45309;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body {
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
  }
  header { background:linear-gradient(135deg, var(--blue), var(--blue-dark)); color:#fff; padding:22px 18px 26px; border-radius:0 0 22px 22px; }
  header h1 { margin:0; font-size:20px; font-weight:700; }
  header p { margin:6px 0 0; font-size:13px; opacity:.9; }
  header .ver { display:inline-block; margin-top:10px; font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(255,255,255,.18); }
  main { padding:14px; max-width:680px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.06), 0 10px 26px -20px rgba(15,23,42,.35); }
  .card > h2 { margin:0 0 14px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; }
  .step { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--blue); color:#fff; font-size:12px; font-weight:700; flex:0 0 auto; }
  .hint { font-size:13px; color:var(--sub); margin:10px 0 0; }
  .row { display:flex; gap:10px; }
  button { font:inherit; border-radius:12px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:14px 16px; min-height:50px; cursor:pointer; }
  button.primary { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; width:100%; }
  button.primary:disabled { opacity:.5; }
  .pick { display:flex; align-items:center; justify-content:center; gap:10px; border:2px dashed #bfdbfe; background:#eff6ff; color:var(--blue-dark); border-radius:14px; padding:22px 16px; font-weight:700; cursor:pointer; }
  input[type=file] { display:none; }
  .files { list-style:none; margin:14px 0 0; padding:0; }
  .files li { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; font-size:14px; }
  .files .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .files .size { color:var(--sub); font-size:12px; flex:0 0 auto; }
  .files .del { flex:0 0 auto; width:32px; height:32px; min-height:32px; padding:0; border-radius:50%; color:var(--err); border-color:#fecaca; background:#fef2f2; font-size:15px; line-height:1; }
  .count { font-size:13px; color:var(--sub); margin:12px 0 0; }
  .presets { display:flex; flex-direction:column; gap:10px; }
  .presets button { width:100%; text-align:left; font-weight:700; font-size:16px; border:1.5px solid #bfdbfe; color:var(--blue-dark); background:#f8fbff; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .presets button::after { content:'›'; font-size:20px; color:#93c5fd; }
  details.more { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
  details.more summary { cursor:pointer; color:var(--sub); font-size:14px; list-style:none; }
  details.more summary::-webkit-details-marker { display:none; }
  details.more summary::before { content:'＋ '; }
  textarea { width:100%; font:15px/1.5 inherit; padding:12px; border:1px solid var(--line); border-radius:12px; margin-top:10px; min-height:88px; resize:vertical; color:var(--ink); }
  input[type=password], input[type=text] { width:100%; font:16px/1.4 inherit; padding:13px; border:1px solid var(--line); border-radius:12px; color:var(--ink); background:#fff; }
  .status { margin-top:14px; font-size:14px; white-space:pre-wrap; color:var(--sub); }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); } .status.warn { color:var(--warn); }
  .dl { display:flex; align-items:center; gap:10px; margin-top:10px; padding:14px 16px; border:1.5px solid var(--blue); border-radius:12px; color:var(--blue-dark); text-decoration:none; font-weight:700; word-break:break-all; background:#f8fbff; }
  .dl::before { content:'⬇︎'; font-size:18px; }
  #modal { position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:100; display:flex; align-items:flex-end; }
  #modal .sheet { background:#fff; width:100%; max-width:680px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px 16px 22px; max-height:88vh; overflow:auto; }
  #modal h2 { margin:0 0 4px; font-size:17px; }
  #modal label { display:block; font-size:13px; color:var(--sub); margin:14px 0 6px; }
  #modal .row { margin-top:18px; }
  #modal .row button { flex:1; }
  #modal .row button.primary { flex:2; }
  .hidden { display:none !important; }
  footer { text-align:center; color:var(--sub); font-size:12px; padding:6px 16px 26px; }
  #debug { position:fixed; left:0; right:0; bottom:64px; z-index:99; background:#0f172a; color:#f8fafc; font:12px/1.5 ui-monospace, Menlo, monospace; padding:10px 12px; max-height:42vh; overflow:auto; white-space:pre-wrap; }
  #debug .dbg-row { cursor:pointer; padding:1px 0; }
  #debugBar { float:right; display:flex; gap:6px; margin:0 0 6px 8px; }
  #debugBar button { min-height:32px; padding:4px 10px; font-size:12px; font-weight:600; border-radius:8px; }
  #debugToggle { position:fixed; right:12px; bottom:12px; z-index:101; min-height:44px; padding:10px 16px; border-radius:999px; background:#fff; box-shadow:0 4px 14px -4px rgba(15,23,42,.4); font-size:13px; font-weight:600; color:var(--sub); }
</style>
</head>
<body>

<script>
// 页面错误收集器（放在最前面）+ 通用复制：保证任何脚本出错都能被看到、被一键复制
window.__pbErrors = [];
window.__pbCopy = function (text, el) {
  var flash = function () {
    if (!el) { return; }
    var old = el.getAttribute('data-label') || el.textContent || '';
    el.textContent = '✅ 已复制';
    setTimeout(function () { el.textContent = old; }, 1200);
  };
  var legacy = function () {
    try {
      var area = document.createElement('textarea');
      area.value = String(text);
      area.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(area);
      area.focus(); area.select(); area.setSelectionRange(0, String(text).length);
      var ok = document.execCommand('copy');
      document.body.removeChild(area);
      if (ok) { flash(); return true; }
    } catch (e) {}
    return false;
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(text)).then(flash, legacy);
      return true;
    }
  } catch (e) {}
  return legacy();
};
window.onerror = function (message, source, line, column) {
  try {
    window.__pbErrors.push(String(message) + ' @' + line + ':' + column);
    var panel = document.getElementById('debug');
    if (panel) {
      panel.style.display = 'block';
      var row = document.createElement('div');
      row.className = 'dbg-row';
      row.setAttribute('data-label', '⚠️ 页面出错：' + message + ' @' + line + ':' + column);
      row.textContent = '⚠️ 页面出错：' + message + ' @' + line + ':' + column;
      row.style.color = '#fca5a5';
      row.onclick = function () { window.__pbCopy(row.getAttribute('data-label'), row); };
      panel.appendChild(row);
      var b = document.getElementById('debugToggle');
      if (b) { b.textContent = '🐞 收起（有错误）'; }
    }
  } catch (e) {}
  return false;
};
</script>

<header>
  <h1>PDF 助手</h1>
  <p>选一份 PDF → 点一个按钮 → 处理好的文件回到这里</p>
  <span class="ver" id="verline">页面版本 v8-redesign</span>
</header>

<main>
  <section class="card" id="authCard">
    <h2><span class="step">1</span>填一次访问口令</h2>
    <input type="password" id="tokenInput" placeholder="访问口令（至少 16 位）" autocomplete="off">
    <p class="hint">口令只存在这台手机里，用来让电脑认得出是你。</p>
    <div class="row" style="margin-top:12px"><button class="primary" id="saveToken">保存并连接</button></div>
    <div class="status" id="authStatus"></div>
  </section>

  <section class="card hidden" id="workCard">
    <h2><span class="step">1</span>选择 PDF</h2>
    <label class="pick" for="fileInput">📄 选择 PDF 文件</label>
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
    <p class="count" id="fileCount">还没有选择文件</p>
    <ul class="files" id="fileList"></ul>
  </section>

  <section class="card hidden" id="actionCard">
    <h2><span class="step">2</span>开始处理</h2>
    <div class="presets" id="presetRow"></div>
    <p class="hint" id="presetHint"></p>

    <details class="more">
      <summary>我要自己写要求</summary>
      <textarea id="customText" placeholder="例如：给这份文件的每页右下角加页码"></textarea>
      <button style="width:100%;margin-top:10px" id="sendCustom">按我写的要求处理</button>
    </details>

    <div class="status" id="statusText"></div>
    <div class="row hidden" id="afterRow" style="margin-top:12px">
      <button id="refreshStatus" style="flex:1">🔄 刷新状态</button>
      <button id="newTask" style="flex:1">➕ 再处理一个</button>
    </div>
    <div id="artifactList"></div>
  </section>
</main>

<footer>只在你自己的网络（同 Wi-Fi 或 Tailscale）内可达</footer>

<div id="modal" class="hidden">
  <div class="sheet">
    <h2 id="modalTitle"></h2>
    <p class="hint" id="modalDesc"></p>
    <div id="modalFields"></div>
    <div class="row">
      <button id="modalCancel">取消</button>
      <button id="modalOk" class="primary">确认提交</button>
    </div>
  </div>
</div>

<!-- 诊断：默认隐藏；开关与复制都是纯内联事件，主脚本崩了也能用 -->
<div id="debug" style="display:none">
  <div id="debugBar">
    <button type="button" id="copyAllBtn"
      onclick="var d=document.getElementById('debug');if(window.__pbCopy){window.__pbCopy(d.innerText||d.textContent,this)}">复制全部</button>
    <button type="button" id="closeDbgBtn"
      onclick="var d=document.getElementById('debug');var b=document.getElementById('debugToggle');d.style.display='none';if(b){b.textContent='🐞 诊断'}">收起 ✕</button>
  </div>
</div>
<button id="debugToggle" type="button"
  onclick="var d=document.getElementById('debug');var b=document.getElementById('debugToggle');var on=!d.style.display||d.style.display==='none';d.style.display=on?'block':'none';b.textContent=on?'🐞 收起':'🐞 诊断';">🐞 诊断</button>

<script>
(function () {
  var PRESETS = __PRESETS__;
  var VERSION = 'v8-redesign';
  var tokenKey = 'pdf-helper-token';
  var taskKey = 'pdf-helper-task';
  var token = '';
  var files = [];
  var currentTask = '';
  var presetFields = {};
  var pollTimer = null;

  function $(id) { return document.getElementById(id); }
  function show(el, yes) { if (!el) { return; } el.className = (el.className.replace(/ ?hidden/g, '') + (yes ? '' : ' hidden')).trim(); }
  function setStatus(id, text, cls) { var el = $(id); if (!el) { return; } el.textContent = text; el.className = 'status ' + (cls || ''); }
  function toArray(list) { var out = []; if (!list) { return out; } for (var i = 0; i < list.length; i += 1) { out.push(list[i]); } return out; }

  function dbg(line) {
    try {
      var el = $('debug');
      if (!el) { return; }
      var row = document.createElement('div');
      row.className = 'dbg-row';
      row.setAttribute('data-label', String(line));
      row.textContent = String(line);
      row.onclick = function () { if (window.__pbCopy) { window.__pbCopy(row.getAttribute('data-label'), row); } };
      el.appendChild(row);
      var rows = el.getElementsByClassName('dbg-row');
      while (rows.length > 40) { el.removeChild(rows[0]); }
      el.scrollTop = el.scrollHeight;
    } catch (e) {}
  }

  function api(path, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers['Authorization'] = 'Bearer ' + token;
    return fetch(path, options).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (body) { return { status: res.status, body: body }; });
    });
  }

  function connect() {
    setStatus('authStatus', '正在连接…');
    api('/api/health').then(function (r) {
      if (r.status !== 200) { setStatus('authStatus', '口令不对，或者电脑上的服务没开。', 'err'); return; }
      try { localStorage.setItem(tokenKey, token); } catch (e) {}
      show($('authCard'), false); show($('workCard'), true); show($('actionCard'), true);
      presetFields = (r.body && r.body.presetFields) || {};
      renderPresets((r.body && r.body.presets) || PRESETS);
    }).catch(function () { setStatus('authStatus', '连不上：检查手机和电脑是否在同一个网络。', 'err'); });
  }
  $('saveToken').onclick = function () {
    token = $('tokenInput').value.trim();
    if (token.length < 16) { setStatus('authStatus', '口令至少 16 位。', 'err'); return; }
    connect();
  };

  // 选文件：只留 PDF 入口；已选文件可以单个删除
  function renderFiles() {
    var list = $('fileList');
    list.innerHTML = '';
    files.forEach(function (file, index) {
      var li = document.createElement('li');
      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = file.name;
      var size = document.createElement('span');
      size.className = 'size';
      size.textContent = Math.max(1, Math.round(file.size / 1024)) + ' KB';
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.setAttribute('aria-label', '删除 ' + file.name);
      del.onclick = function () { files.splice(index, 1); renderFiles(); };
      li.appendChild(name); li.appendChild(size); li.appendChild(del);
      list.appendChild(li);
    });
    $('fileCount').textContent = files.length === 0
      ? '还没有选择文件'
      : ('已选 ' + files.length + ' 个' + (files.length > 1 ? '（会一起交给这次任务）' : ''));
  }
  $('fileInput').onchange = function (event) {
    setTimeout(function () {
      var picked = toArray(event.target.files);
      picked.forEach(function (file) {
        var dup = files.some(function (g) { return g.name === file.name && g.size === file.size; });
        if (!dup) { files.push(file); }
      });
      renderFiles();
      if (picked.length === 0) { setStatus('statusText', '这次选择没有返回文件，再试一次。', 'err'); }
    }, 0);
  };
  renderFiles();

  function renderPresets(names) {
    try {
      var row = $('presetRow');
      if (!row) { return; }
      var list = toArray(names || []);
      row.innerHTML = '';
      var hint = $('presetHint');
      if (list.length === 0) { if (hint) { hint.textContent = '这台电脑还没配置预设，用下面的"自己写要求"。'; } return; }
      if (hint) { hint.textContent = '点按钮后可以改产物文件名，确认才会开始。'; }
      list.forEach(function (name) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = name;
        b.onclick = function () { openConfirm(name); };
        row.appendChild(b);
      });
      dbg('已渲染预设按钮: ' + list.join(' / '));
    } catch (e) { dbg('❌ 渲染预设失败: ' + e); }
  }
  renderPresets(PRESETS);

  function fileNameBase() {
    if (files.length === 0) { return '产物'; }
    var name = String(files[0].name).replace(/\.[^.]+$/, '');
    var cleaned = name.replace(/[（(]答案[)）]\s*$/u, '').replace(/\+?\s*答案\s*$/u, '').trim();
    return cleaned !== '' ? cleaned : name;
  }

  function openConfirm(instruction) {
    var isPreset = Object.prototype.hasOwnProperty.call(presetFields, instruction);
    var fields = isPreset ? toArray(presetFields[instruction]) : [];
    $('modalTitle').textContent = isPreset ? instruction : '确认提交';
    $('modalDesc').textContent = isPreset
      ? '下面是产物文件名，可以改；留空就用默认命名。'
      : '确认后立刻开始处理。';
    var box = $('modalFields');
    box.innerHTML = '';
    if (fields.length === 0) {
      var p1 = document.createElement('p');
      p1.className = 'hint';
      p1.textContent = String(instruction).slice(0, 160);
      box.appendChild(p1);
    }
    fields.forEach(function (f) {
      var label = document.createElement('label');
      label.textContent = f.label;
      label.setAttribute('for', 'field_' + f.key);
      var input = document.createElement('input');
      input.type = 'text';
      input.id = 'field_' + f.key;
      input.value = fileNameBase() + (f.suffix || '');
      box.appendChild(label); box.appendChild(input);
    });
    $('modalOk').onclick = function () { confirmSubmit(instruction, fields); };
    $('modalCancel').onclick = function () { show($('modal'), false); };
    show($('modal'), true);
    dbg('弹窗已打开：' + (isPreset ? instruction : '自定义') + '（输入框 ' + fields.length + ' 个）');
  }

  function confirmSubmit(instruction, fields) {
    var text = instruction;
    if (fields.length > 0) {
      var lines = [];
      fields.forEach(function (f) {
        var el = $('field_' + f.key);
        var value = el ? String(el.value).trim() : '';
        if (value !== '') { lines.push(f.label + '：' + value); }
      });
      if (lines.length > 0) { text = instruction + '\n\n【本次命名要求（以此为准）】\n' + lines.join('\n'); }
    }
    show($('modal'), false);
    startSubmit(text);
  }

  function readBase64(file) {
    return new Promise(function (resolve) {
      var reader = new FileReader();
      reader.onload = function () { var s = String(reader.result); resolve(s.slice(s.indexOf(',') + 1)); };
      reader.onerror = function () { resolve(''); };
      reader.readAsDataURL(file);
    });
  }
  function setBusy(busy) {
    var buttons = document.querySelectorAll('#presetRow button, #sendCustom');
    for (var i = 0; i < buttons.length; i += 1) { buttons[i].disabled = !!busy; }
    show($('afterRow'), !busy);
  }

  function startSubmit(instruction) {
    if (!instruction) { return; }
    if (files.length === 0) { setStatus('statusText', '先在上面选择一份 PDF。', 'err'); return; }
    setBusy(true);
    setStatus('statusText', '⏳ 正在上传（' + files.length + ' 个文件）…', 'warn');
    $('artifactList').innerHTML = '';
    Promise.all(files.map(function (f) {
      return readBase64(f).then(function (b64) { return { name: f.name, contentBase64: b64 }; });
    })).then(function (payload) {
      return api('/api/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction: instruction, files: payload }) });
    }).then(function (r) {
      if (r.status !== 202) {
        setBusy(false);
        setStatus('statusText', r.status === 401 ? '口令不对。' : ('提交失败：' + JSON.stringify(r.body)), 'err');
        return;
      }
      currentTask = r.body.taskId;
      try { localStorage.setItem(taskKey, currentTask); } catch (e) {}
      setStatus('statusText', '✅ 已提交：' + String(instruction).split('\n')[0] + '\n任务号 ' + currentTask + '\n正在处理，通常 1~3 分钟，我每 2 秒自动刷新。', 'warn');
      startPolling();
    }).catch(function (e) { setBusy(false); setStatus('statusText', '提交出错：' + e, 'err'); });
  }

  function schedulePoll(ms) { if (pollTimer) { clearTimeout(pollTimer); } pollTimer = setTimeout(poll, ms); }
  function startPolling() { schedulePoll(400); }
  function poll() {
    if (!currentTask) { return; }
    var startedAt = Date.now();
    api('/api/task/' + encodeURIComponent(currentTask)).then(function (r) {
      if (r.status !== 200) { schedulePoll(3000); return; }
      var s = r.body.status;
      var label = { queued: '⏳ 排队中', ok: '✅ 处理完成', timeout: '⏱️ 超时', error: '❌ 处理失败', running: '⚙️ 处理中' }[s] || s;
      var stamp = new Date().toLocaleTimeString();
      setStatus('statusText', label + '\n任务号 ' + currentTask + (s === 'ok' ? '' : '\n（' + stamp + ' 更新，通常 1~3 分钟）'),
        s === 'ok' ? 'ok' : ((s === 'error' || s === 'timeout') ? 'err' : 'warn'));
      if (s === 'ok' || s === 'error' || s === 'timeout') {
        if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
        setBusy(false);
        try { localStorage.removeItem(taskKey); } catch (e) {}
        renderArtifacts(toArray(r.body.artifacts || []));
      } else {
        schedulePoll(Date.now() - startedAt > 30000 ? 5000 : 2000);
      }
    }).catch(function () { schedulePoll(5000); });
  }
  function renderArtifacts(list) {
    var box = $('artifactList');
    box.innerHTML = '';
    if (list.length === 0) { box.innerHTML = '<p class="hint">这次没有可下载的产物（详情见飞书回执）。</p>'; return; }
    var head = document.createElement('p');
    head.className = 'hint';
    head.textContent = '产物 ' + list.length + ' 个 —— 点一下下载，然后就能在微信里转发：';
    box.appendChild(head);
    list.forEach(function (path, index) {
      var a = document.createElement('a');
      a.className = 'dl';
      a.href = '/api/artifact?token=' + encodeURIComponent(token) + '&taskId=' + encodeURIComponent(currentTask)
        + '&index=' + index + '&name=' + encodeURIComponent(String(path).split('/').pop());
      a.textContent = String(path).split('/').pop();
      box.appendChild(a);
    });
    box.insertAdjacentHTML('beforeend', '<p class="hint">飞书群里也会收到同样一份。</p>');
  }
  $('refreshStatus').onclick = function () { poll(); };
  $('newTask').onclick = function () {
    currentTask = ''; files = []; renderFiles();
    setStatus('statusText', ''); $('artifactList').innerHTML = '';
    $('customText').value = '';
    try { localStorage.removeItem(taskKey); } catch (e) {}
  };
  document.addEventListener('visibilitychange', function () { if (!document.hidden && currentTask) { poll(); } });
  window.addEventListener('focus', function () { if (currentTask) { poll(); } });

  $('sendCustom').onclick = function () {
    var text = $('customText').value.trim();
    if (!text) { setStatus('statusText', '先写一句要求，或者直接点上面的按钮。', 'err'); return; }
    openConfirm(text);
  };

  dbg('页面 ' + VERSION + ' 已加载 ' + new Date().toLocaleTimeString());
  dbg('可用预设：' + toArray(PRESETS).join(' / '));
  try {
    var saved = localStorage.getItem(tokenKey);
    if (saved && saved.length >= 16) { token = saved; $('tokenInput').value = saved; connect(); }
    var lastTask = localStorage.getItem(taskKey);
    if (lastTask) { currentTask = lastTask; setBusy(true); setStatus('statusText', '正在查询上一个任务 ' + lastTask + ' …', 'warn'); startPolling(); }
  } catch (e) {}
})();
</script>
</body>
</html>
